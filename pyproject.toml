[project]
name = "chython-synplan"
version = "1.104"
description = "Library for processing molecules and reactions in python way"
authors = [
    { name = "Ramil Nugmanov", email = "nougmanoff@protonmail.com" }
]
license = "LGPL-3.0-or-later"
readme = "README.rst"
requires-python = ">=3.10,<4.0"
classifiers = [
    "Environment :: Plugins",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    # cachedmethods was vendored into chython/_cache.py — see priority-rules
    # bug #5 (0.2.0 broke chython's slotted Element classes; 0.2.1 was never
    # published to PyPI). chython is now standalone for caching needs.
    "lazy-object-proxy>=1.6",
    "numpy>=2.0.0"
]

[project.urls]
homepage = "https://github.com/chython/chython"
documentation = "https://chython.readthedocs.io"

[project.optional-dependencies]
mapping = ["chytorch-rxnmap-synplan>=1.7"]
rdkit = ["rdkit>=2023.9"]
png = ["pyppeteer>=2.0.0"]
racer-default = ["mini-racer>=0.12.4"]
racer-deprecated = ["py-mini-racer"]

[dependency-groups]
dev = ["pytest>=7.4.3"]
docs = [
    "nbsphinx>=0.9.3",
    "pandoc>=2.3",
    "rdkit>=2023.9.1",
    "ipython>=8.12.1"
]

[tool.setuptools.packages.find]
include = ["chython*"]

[tool.setuptools.package-data]
# listed per package rather than globbing *.so across the tree, which would also
# sweep up stale build artifacts; the cython extensions come from ext_modules
"chython.files.libinchi" = ["*.dll", "*.so", "*.dylib", "*.dynlib"]
"chython.algorithms.calculate2d" = ["clean2d.js"]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=77", "cython>=3.0.5"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
# The fork tracks upstream by backporting individual patches, so reformatting files it does not
# own would make every future backport conflict. Ruff is scoped to the files the fork adds.
include = [
    "chython/periodictable/base/synthon.py",
    "chython/containers/synthon.py",
    "chython/containers/test/test_synthon.py",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# UP/RUF are omitted: the fork keeps upstream's Optional[...] and __all__ conventions.
select = ["F", "E", "W", "B", "C4"]
