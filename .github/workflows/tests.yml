name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # every wheel platform is represented; the Python matrix is widened on
        # linux only, where runners are cheapest
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: ubuntu-24.04-arm
            python-version: "3.13"
          - os: macos-15
            python-version: "3.13"
          - os: macos-15-intel
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build extensions and install
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --no-sync python -m pytest -q
